name: Test CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  frontend-tests:
    name: Frontend Tests (vitest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

  rust-tests:
    name: Rust Tests
    runs-on: windows-latest
    env:
      # crates.io からの取得が途中で切れる一時障害（curl [18] partial file 等）に対する再試行。
      CARGO_NET_RETRY: "10"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # 依存（registry/git/target）をキャッシュ。cache hit 時は crates.io から再DLしないため
      # ネットワーク起因のフレークを避けつつ高速化する（Cargo.lock をキーに自動失効）。
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Run rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
