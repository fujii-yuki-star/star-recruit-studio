[package]
name = "star-recruit-studio"
version = "0.1.0"
description = "ゆうこ採用ムービーメーカー (working name: star-recruit-studio)"
authors = ["Star System"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "star_recruit_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
reqwest = { version = "0.12", features = ["json"] }
# APIキーは OS 資格情報ストアに保存（§13§7）。MVP は Windows 優先（CLAUDE.md §3）＝Windows 資格情報マネージャ。
# 他OS対応時は target 別 feature（apple-native / sync-secret-service 等）を追加する。
keyring = { version = "3", features = ["windows-native"] }

