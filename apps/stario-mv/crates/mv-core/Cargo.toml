[package]
name = "mv-core"
version = "0.0.1"
description = "すたりおMV の芯（プロジェクトの形・検査・読み書き）。画面にも Tauri にも依存しない。"
edition = "2021"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ulid = "1"
jsonschema = { version = "0.33", default-features = false }

[dev-dependencies]
tempfile = "3"
