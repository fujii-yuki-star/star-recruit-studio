[package]
name = "stario-mv"
version = "0.0.1"
description = "すたりおMV（姉妹ソフト・γ）"
authors = ["Star System"]
edition = "2021"

[lib]
# ⚠️ α（star_recruit_studio_lib）と別の名前＝バイナリ名・インストーラーの識別も分かれる（ADR-0075 決定1）。
name = "stario_mv_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mv-core = { path = "../crates/mv-core" }
mv-render = { path = "../crates/mv-render" }
mv-export = { path = "../crates/mv-export" }
mv-ops = { path = "../crates/mv-ops" }
tauri-plugin-dialog = "2"
wgpu = "30"
cpal = "0.18"

[dev-dependencies]
tempfile = "3"
